<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon para o Google Search (192x192 atende ao requisito de múltiplo de 48px) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Favicons padrão para navegadores e iOS -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=1024, initial-scale=0.35, maximum-scale=1.0, user-scalable=yes">

    <!-- Título do site -->
    <title>Amethra</title>

    <!-- Resumo / Descrição para o Google (SEO) -->
    <meta name="description" content="AMETHRA - Um jogo educativo em desenvolvimento para você testar seus conhecimentos e aprender mineralogia e cristalografia." />

    <link rel="canonical" href="https://www.amethra.com.br/" />

    <!-- Meta tags para redes sociais (WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:title" content="Amethra" />
    <meta property="og:description" content="Um jogo educativo em desenvolvimento para você testar seus conhecimentos e aprender mineralogia e cristalografia." />
    <meta property="og:image" content="https://www.amethra.com.br/android-chrome-512x512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.amethra.com.br/" />

    <!-- Meta tags para o Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amethra" />
    <meta name="twitter:description" content="Um jogo educativo em desenvolvimento para você testar seus conhecimentos e aprender mineralogia e cristalografia." />
    <meta name="twitter:image" content="https://www.amethra.com.br/android-chrome-512x512.png" />

    <!-- Dados estruturados: associa o logo à marca no Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Amethra",
      "url": "https://www.amethra.com.br",
      "logo": "https://www.amethra.com.br/android-chrome-512x512.png"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
